version: '3.8'

services:
  # ========================
  # PostgreSQL Database
  # ========================
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ========================
  # Telegram Bot
  # ========================
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - bot_data:/app/data

  # ========================
  # Website (API + Frontend)
  # ========================
  website:
    build: ./website
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8050:8050"

  # ========================
  # Nginx Reverse Proxy
  # ========================
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - website
      - bot

  # ========================
  # Marzban & MariaDB
  # ========================
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: marzban
      MYSQL_USER: marzban
      MYSQL_PASSWORD: marzban_password
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"

  marzban:
    build: 
      context: ./marzban-core
      dockerfile: Dockerfile
    restart: always
    env_file: ./marzban-core/.env
    network_mode: host
    depends_on:
      - mariadb
      - tor
    volumes:
      - /var/lib/marzban:/var/lib/marzban

  # ========================
  # Tor Proxy (For Dark Web)
  # ========================
  tor:
    image: dperson/torproxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:9050:9050"

volumes:
  pgdata:
  bot_data:
  mariadb_data:
