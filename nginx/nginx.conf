events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Логирование
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=5r/s;

    # ========================================
    # HTTP → HTTPS redirect
    # ========================================
    server {
        listen 80;
        server_name {{SITE_DOMAIN}} www.{{SITE_DOMAIN}};

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ========================================
    # Панель управления Marzban (HTTP)
    # ========================================
    server {
        listen 80;
        server_name {{PANEL_DOMAIN}};

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ========================================
    # HTTPS — основной сервер (Сайт)
    # ========================================
    server {
        listen 443 ssl http2;
        server_name {{SITE_DOMAIN}} www.{{SITE_DOMAIN}};

        # SSL сертификаты (замени на свои пути после certbot)
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ==== Сайт (Frontend + API) ====
        location / {
            proxy_pass http://website:8050;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==== Webhooks (Platega для сайта — отдельный rate limit) ====
        location /api/webhook/ {
            limit_req zone=webhook burst=5 nodelay;
            proxy_pass http://website:8050/api/webhook/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ========================================
    # Панель управления Marzban (HTTPS)
    # ========================================
    server {
        listen 443 ssl http2;
        server_name {{PANEL_DOMAIN}};

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ========================================
    # Webhook сервер для бота (порт 443)
    # ========================================
    server {
        listen 443 ssl;
        server_name paysell.{{SUB_DOMAIN}};

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        location /platega/webhook {
            limit_req zone=webhook burst=5 nodelay;
            proxy_pass http://bot:8443/platega/webhook;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /cryptobot/webhook {
            limit_req zone=webhook burst=5 nodelay;
            proxy_pass http://bot:8443/cryptobot/webhook;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
